<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿アプリ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    #loading { display: none; color: blue; }
  </style>
</head>
<body>
  <h2>レシート読み取り</h2>
  
  <!-- レシート撮影用 -->
  <input type="file" id="receiptImage" accept="image/*" capture="environment">
  <button onclick="analyzeImage()">画像を読み取る</button>
  <p id="loading">読み取り中...（十数秒かかります）</p>

  <hr>

  <h2>編集・確認画面（手入力も可）</h2>
  <label>日付: <input type="text" id="date"></label>
  <label>店舗名: <input type="text" id="store"></label>
  <label>レシート合計金額: <input type="number" id="total_amount"></label>

  <h3 style="margin-bottom: 5px;">購入品目</h3>
  <div id="items-container">
    <!-- ここに動的に品目入力欄が追加されます -->
  </div>
  
  <button onclick="addItemRow('', '')" style="background-color: #e0e0e0; color: #333; border: none;">＋ 品目を追加する</button>

  <input type="hidden" id="imageUrl">
  <input type="hidden" id="inputMethod" value="手入力">

  <hr>

  <button onclick="saveData()" style="background-color: #4CAF50; color: white; font-weight: bold;">この内容で確定する</button>

  <script>
    // ▼「新しいデプロイ」で発行されたURLをここに貼り付けてください
    const GAS_URL = 'https://script.google.com/macros/s/あなたのGAS_URL/exec';

    // 品目の入力行（品目名＋金額＋削除ボタン）を動的に追加する関数
    function addItemRow(nameValue, priceValue) {
      const container = document.getElementById('items-container');
      const row = document.createElement('div');
      row.className = 'item-row';
      row.style.display = 'flex';
      row.style.gap = '5px';
      row.style.marginBottom = '10px';
      
      row.innerHTML = `
        <input type="text" placeholder="品目名" value="${nameValue || ''}" class="item-name" style="flex: 2; margin: 0;">
        <input type="number" placeholder="金額" value="${priceValue || ''}" class="item-price" style="flex: 1; margin: 0;">
        <button type="button" onclick="this.parentElement.remove()" style="width: 40px; margin: 0; background-color: #ff5252; color: white; border: none; border-radius: 4px;">×</button>
      `;
      container.appendChild(row);
    }

    // 画面読み込み時に、初期状態として1行だけ空の品目枠を入れておく
    window.onload = () => { addItemRow('', ''); };

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function analyzeImage() {
      const fileInput = document.getElementById('receiptImage');
      if (!fileInput.files.length) return alert('画像を選択してください');

      document.getElementById('loading').style.display = 'block';
      const file = fileInput.files[0];
      const base64Data = await getBase64(file);
      const base64String = base64Data.split(',')[1];
      
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'analyze', imageBase64: base64String, mimeType: file.type })
        });
        
        const result = await response.json();
        document.getElementById('loading').style.display = 'none';

        if (result.status === 'success') {
          document.getElementById('date').value = result.data.date || '';
          document.getElementById('store').value = result.data.store || '';
          document.getElementById('total_amount').value = result.data.total_amount || '';
          document.getElementById('imageUrl').value = result.data.imageUrl || '';
          document.getElementById('inputMethod').value = 'OCR';

          // 一旦既存の品目入力枠をすべてクリア
          document.getElementById('items-container').innerHTML = '';

          // Geminiから返ってきた品目の数だけ入力枠を自動生成
          if (result.data.items && result.data.items.length > 0) {
            result.data.items.forEach(item => {
              addItemRow(item.name, item.price);
            });
          } else {
            addItemRow('', ''); // 品目が無い場合は空枠を1つ
          }
          alert('読み取り完了しました。内容を確認・修正してください。');
        } else {
          alert('読み取りエラー: ' + result.message);
        }
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        alert('通信エラー: ' + e.toString());
      }
    }

    async function saveData() {
      // 画面上のすべての品目行（.item-row）を取得し、配列にまとめる
      const itemElements = document.querySelectorAll('.item-row');
      const itemsArray = [];
      itemElements.forEach(row => {
        const name = row.querySelector('.item-name').value;
        const price = row.querySelector('.item-price').value;
        if (name || price) { // どちらかが入力されていれば保存対象にする
          itemsArray.push({ name: name, price: price });
        }
      });

      const data = {
        date: document.getElementById('date').value,
        store: document.getElementById('store').value,
        total_amount: document.getElementById('total_amount').value,
        items: itemsArray,
        imageUrl: document.getElementById('imageUrl').value,
        inputMethod: document.getElementById('inputMethod').value
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'save', data: data })
        });

        const result = await response.json();
        if (result.status === 'success') {
          alert('スプレッドシートに保存しました！');
          // フォームをリセット
          document.getElementById('date').value = '';
          document.getElementById('store').value = '';
          document.getElementById('total_amount').value = '';
          document.getElementById('receiptImage').value = '';
          document.getElementById('inputMethod').value = '手入力';
          document.getElementById('items-container').innerHTML = '';
          addItemRow('', '');
        } else {
          alert('保存エラー: ' + result.message);
        }
      } catch (e) {
        alert('通信エラー: ' + e.toString());
      }
    }
  </script>
</body>
</html>
