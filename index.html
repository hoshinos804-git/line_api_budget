<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿アプリ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    #loading { display: none; color: blue; }
  </style>
</head>
<body>
  <h2>レシート読み取り</h2>
  
  <!-- レシート撮影用 -->
  <input type="file" id="receiptImage" accept="image/*" capture="environment">
  <button onclick="analyzeImage()">画像を読み取る</button>
  <p id="loading">読み取り中...（十数秒かかります）</p>

  <hr>

  <h2>編集・確認画面（手入力も可）</h2>
  <label>日付: <input type="text" id="date"></label>
  <label>店舗名: <input type="text" id="store"></label>
  <label>金額: <input type="number" id="amount"></label>
  <label>品目: <input type="text" id="items"></label>
  <input type="hidden" id="imageUrl">
  <input type="hidden" id="inputMethod" value="手入力">

  <button onclick="saveData()">この内容で確定する</button>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzNFk4t3t0yzb_78mUixvvaAGlKSNRSz7gLg8rIOtWrxMlbLS5gBJDiRvBqqYFWvFhVjQ/exec';

    // 画像をBase64形式に変換する関数
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // 1. 画像解析処理
    async function analyzeImage() {
      const fileInput = document.getElementById('receiptImage');
      if (!fileInput.files.length) return alert('画像を選択してください');

      document.getElementById('loading').style.display = 'block';
      const file = fileInput.files[0];
      
      // 画像データをBase64に変換し、ヘッダー部分(data:image/jpeg;base64,)を切り離す
      const base64Data = await getBase64(file);
      const base64String = base64Data.split(',')[1];
      const mimeType = file.type;

      // GASに送信
      const response = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'analyze', imageBase64: base64String, mimeType: mimeType })
      });
      
      const result = await response.json();
      document.getElementById('loading').style.display = 'none';

      if (result.status === 'success') {
        // 返ってきたデータを入力フォームに自動セット
        document.getElementById('date').value = result.data.date || '';
        document.getElementById('store').value = result.data.store || '';
        document.getElementById('amount').value = result.data.amount || '';
        document.getElementById('items').value = result.data.items || '';
        document.getElementById('imageUrl').value = result.data.imageUrl || '';
        document.getElementById('inputMethod').value = 'OCR';
        alert('読み取り完了しました。内容を確認・修正してください。');
      } else {
        alert('エラー詳細: ' + result.message);
      }
    }

    // 2. スプレッドシート保存処理
    async function saveData() {
      const data = {
        date: document.getElementById('date').value,
        store: document.getElementById('store').value,
        amount: document.getElementById('amount').value,
        items: document.getElementById('items').value,
        imageUrl: document.getElementById('imageUrl').value,
        inputMethod: document.getElementById('inputMethod').value
      };

      const response = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save', data: data })
      });

      const result = await response.json();
      if (result.status === 'success') {
        alert('スプレッドシートに保存しました！');
        // フォームをリセット
        document.querySelectorAll('input[type="text"], input[type="number"]').forEach(el => el.value = '');
        document.getElementById('receiptImage').value = '';
        document.getElementById('inputMethod').value = '手入力';
      }
    }
  </script>
</body>
</html>
